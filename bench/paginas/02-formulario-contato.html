<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fale conosco</title><link rel="stylesheet" href="/_comum.css"><script src="/_comum.js"></script></head>
<body data-tarefa="02-formulario-contato">
<h1>Fale conosco</h1>
<form id="form">
  <label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name">
  <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email">
  <label for="assunto">Assunto</label>
  <select id="assunto" name="assunto">
    <option value="">Escolha um assunto</option>
    <option value="vendas">Vendas</option>
    <option value="suporte">Suporte técnico</option>
    <option value="financeiro">Financeiro</option>
  </select>
  <label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" rows="4"></textarea>
  <div><button type="submit">Enviar</button></div>
</form>
<p id="aviso" role="status"></p>
<script>
  form.onsubmit = (event) => {
    event.preventDefault();
    if (!nome.value || !email.value || !assunto.value || !mensagem.value) { avisar('Preencha todos os campos.'); return; }
    registrar({ enviado: { nome: nome.value, email: email.value, assunto: assunto.value, mensagem: mensagem.value } });
    avisar('Mensagem enviada. Responderemos em até 2 dias úteis.');
  };
</script>
</body></html>
